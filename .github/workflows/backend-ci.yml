name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install Node dependencies
      working-directory: ./backend
      run: npm ci

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: './backend/ml/requirements.txt'

    - name: Install Python dependencies
      working-directory: ./backend/ml
      run: pip install -r requirements.txt

    - name: Run ML service and tests
      working-directory: ./backend
      run: |
        cd ml
        python inference/grievanceiq_inference.py &
        ML_PID=$!
        trap 'kill -9 $ML_PID || true' EXIT
        timeout 30 bash -c 'until curl -s http://localhost:5001/health | jq -e ".status == \"ok\"" > /dev/null; do sleep 2; done' || true
        timeout 30 python inference/ci_smoke_test.py
        cd ..
        timeout 60 npm test
      env:
        NODE_OPTIONS: --experimental-vm-modules
        NODE_ENV: test
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        ML_SERVICE_SECRET: ${{ secrets.ML_SERVICE_SECRET }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        REDIS_URL: redis://127.0.0.1:6379

    - name: Run real MiniLM smoke test
      working-directory: ./backend
      run: node scripts/test_real_embedding.js
      env:
        USE_REAL_MODEL: true
