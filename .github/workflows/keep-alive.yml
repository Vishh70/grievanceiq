name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -s --max-time 30 https://grievanceiq-gky1.onrender.com/api/health || echo "Ping failed, but that's okay if it's waking up"
