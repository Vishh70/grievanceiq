<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GrievanceIQ — AI-Powered Citizen Complaint Intelligence Platform. Submit, track and manage civic grievances with AI-powered classification, priority prediction and department routing." />
    <title>GrievanceIQ — AI-Powered Citizen Complaint Platform</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <style>
        body, html {
          margin: 0;
          padding: 0;
          width: 100vw;
          height: 100vh;
          background-color: #0f172a; /* Dark theme background */
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .initial-loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .bolt-logo {
          font-size: 5rem;
          line-height: 1;
          animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
          filter: drop-shadow(0 0 25px rgba(99,102,241,0.8));
          margin-bottom: 20px;
        }
        .loader-text {
          color: #f8fafc;
          font-weight: 800;
          letter-spacing: 4px;
          font-size: 1.5rem;
          text-transform: uppercase;
          background: linear-gradient(90deg, #6366f1, #a855f7);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: fade 1.5s ease-in-out infinite alternate;
        }
        .loader-subtext {
          color: #94a3b8;
          font-size: 0.9rem;
          margin-top: 10px;
          font-weight: 500;
          letter-spacing: 1px;
        }
        .progress-bar-container {
          width: 250px;
          height: 4px;
          background: rgba(255,255,255,0.05);
          border-radius: 4px;
          margin-top: 30px;
          overflow: hidden;
          position: relative;
        }
        .progress-bar {
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          width: 50%;
          background: linear-gradient(90deg, transparent, #6366f1, #a855f7, transparent);
          animation: load 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: .8; }
        }
        @keyframes fade {
          0% { opacity: 0.6; }
          100% { opacity: 1; }
        }
        @keyframes load {
          0% { transform: translateX(-150%); }
          100% { transform: translateX(250%); }
        }
      </style>
      <div class="initial-loader-container">
        <div class="bolt-logo">⚡</div>
        <div class="loader-text">GrievanceIQ</div>
        <div class="loader-subtext">Initializing Civic Intelligence</div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
